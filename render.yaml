services:
  # Python FastAPI Backend
  - type: web
    name: urjasetu-api
    env: python
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: cd apps/api && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urjasetu-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

  # Node.js Payment Gateway
  - type: web
    name: urjasetu-payment-gateway
    env: node
    buildCommand: cd apps/payment-gateway && npm install && npm run build
    startCommand: cd apps/payment-gateway && npm start
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: urjasetu-api
          property: host
          
databases:
  - name: urjasetu-db
    databaseName: urjasetu
    user: urjasetu_user
